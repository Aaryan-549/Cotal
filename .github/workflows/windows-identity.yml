name: Windows creation identity
on:
  pull_request:
    paths:
      - packages/workspace/src/pid.ts
      - packages/workspace/src/win32-process.ts
      - packages/workspace/native/**
      - packages/workspace/scripts/**
      - packages/workspace/smoke/pid-identity.smoke.ts
      - packages/workspace/smoke/win32-creation-native.smoke.ts
      - bin/smoke/mutations/pid-identity.json
      - scripts/mutation-proof.mjs
      - scripts/release-cold-environment.mjs
      - scripts/release-cold-environment.d.mts
      - scripts/release-cold-environment.smoke.mjs
      - .github/workflows/windows-identity.yml
  push:
    branches: [main, fix/windows-native-creation-binding]
permissions:
  contents: read
jobs:
  build-native:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            compiler: amd64
          - runner: windows-11-arm
            arch: arm64
            compiler: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
      - name: Compile against pinned Node-API headers and import library
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" exit /b 1
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do set "VS=%%i"
          if not defined VS exit /b 1
          call "%VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=${{ matrix.compiler }} -host_arch=${{ matrix.compiler }}
          if errorlevel 1 exit /b 1
          node packages/workspace/scripts/build-native.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-identity-native-${{ matrix.arch }}
          path: packages/workspace/build/Release/win32-${{ matrix.arch }}
          if-no-files-found: error

  native:
    needs: build-native
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-identity-native-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          path: packages/workspace/build/Release/win32-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cotal-ai/core --filter @cotal-ai/workspace build
      - run: pnpm --filter @cotal-ai/workspace typecheck
      - run: node scripts/release-cold-environment.smoke.mjs
      - name: Read native identity from the first empty profile
        run: node --import tsx packages/workspace/smoke/win32-creation-native.smoke.ts
      - name: Prove the native cold read and its named reversion
        env:
          PROOF_CONFIG: ${{ runner.temp }}/windows-creation-proof.json
        shell: pwsh
        run: |
          node --input-type=module -e '
            import {readFileSync,writeFileSync} from "node:fs";
            const original=JSON.parse(readFileSync("bin/smoke/mutations/pid-identity.json","utf8"));
            const mutation=original.mutations.find(m=>m.name.startsWith("M11 "));
            if(!mutation)throw new Error("missing Windows creation mutation");
            const command=JSON.stringify(process.execPath.replaceAll("\\","/"))+" --import tsx packages/workspace/smoke/win32-creation-native.smoke.ts";
            const cell="W1 a cold Windows process has a native creation token";
            const proof={suite:["packages/workspace/smoke/win32-creation-native.smoke.ts"],command,mutations:[{...mutation,command,expectRed:cell,cell}]};
            delete proof.mutations[0].afterRestore;
            writeFileSync(process.env.PROOF_CONFIG,JSON.stringify(proof,null,2));
          '
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/mutation-proof.mjs --config "$env:PROOF_CONFIG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
